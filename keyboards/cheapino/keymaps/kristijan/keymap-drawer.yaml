# keymap-drawer config, used by draw.sh
parse_config:
  # Also mark the second key that holds a layer (e.g. Backspace for NAV)
  mark_alternate_layer_activators: true
  # Whole keycodes as `qmk c2json` prints them (layer names already replaced
  # with numbers by draw.sh).
  raw_binding_map:
    # Home row mods
    'LGUI_T(KC_A)': {t: A, h: Gui}
    'LALT_T(KC_S)': {t: S, h: Alt}
    'LCTL_T(KC_D)': {t: D, h: Ctrl}
    'LSFT_T(KC_F)': {t: F, h: Shift}
    'LSFT_T(KC_J)': {t: J, h: Shift}
    'LCTL_T(KC_K)': {t: K, h: Ctrl}
    'LALT_T(KC_L)': {t: L, h: Alt}
    'LGUI_T(KC_SCLN)': {t: ;, h: Gui}
    # Thumbs (layer-taps are left to the parser, so it can mark held keys)
    'LSFT_T(KC_TAB)': {t: Tab, h: Shift}
    'TD(TD_RBRC)': {t: ']', h: Alt, s: '2× Ctrl+]'}
    KC_DEL: Del
    # Modifiers
    KC_LGUI: Gui
    KC_LALT: Alt
    KC_LCTL: Ctrl
    KC_LSFT: Shift
    # Navigation and mouse
    KC_LEFT: ←
    KC_DOWN: ↓
    KC_UP: ↑
    KC_RGHT: →
    KC_PSCR: PrtSc
    MS_LEFT: Ms ←
    MS_DOWN: Ms ↓
    MS_UP: Ms ↑
    MS_RGHT: Ms →
    MS_BTN1: LMB
    MS_BTN2: RMB
    MS_BTN3: MMB
    # Misc
    CW_TOGG: Caps Word
    QK_BOOT: Boot
    # Encoder: press in the middle, turns above (↺) and below (↻). Keep in sync with
    # encoder_turns[] and encoder_clicks[] in keymap.c
    ENC_BASE: {s: ↺ Vol+, t: Mute, h: ↻ Vol-}
    ENC_NAV: {s: ↺ Scroll↓, t: RGB, h: ↻ Scroll↑}
    ENC_SYM: {s: ↺ Prev, t: Play/Pause, h: ↻ Next}
    ENC_FUN: {s: ↺ Scroll↓, t: MMB, h: ↻ Scroll↑}

  # Labels for plain keycodes (without KC_). Setting this replaces
  # keymap-drawer's built-in map, so its defaults are copied in below.
  qmk_keycode_map:
    SPC: Space
    ENT: ⏎
    BSPC: ⌫
    ESC: Esc
    # keymap-drawer defaults
    XXXXXXX: ''
    'NO': ''
    MINUS: '-'
    MINS: '-'
    EQUAL: '='
    EQL: '='
    LEFT_BRACKET: '['
    LBRC: '['
    RIGHT_BRACKET: ']'
    RBRC: ']'
    BACKSLASH: \
    BSLS: \
    NONUS_HASH: '#'
    NUHS: '#'
    SEMICOLON: ;
    SCLN: ;
    QUOTE: ''''
    QUOT: ''''
    GRAVE: '`'
    GRV: '`'
    COMMA: ','
    COMM: ','
    DOT: .
    SLASH: /
    SLSH: /
    TILDE: '~'
    TILD: '~'
    EXCLAIM: '!'
    EXLM: '!'
    AT: '@'
    HASH: '#'
    DOLLAR: $
    DLR: $
    PERCENT: '%'
    PERC: '%'
    CIRCUMFLEX: ^
    CIRC: ^
    AMPERSAND: '&'
    AMPR: '&'
    ASTERISK: '*'
    ASTR: '*'
    LEFT_PAREN: (
    LPRN: (
    RIGHT_PAREN: )
    RPRN: )
    UNDERSCORE: _
    UNDS: _
    PLUS: +
    LEFT_CURLY_BRACE: '{'
    LCBR: '{'
    RIGHT_CURLY_BRACE: '}'
    RCBR: '}'
    PIPE: '|'
    COLON: ':'
    COLN: ':'
    DOUBLE_QUOTE: '"'
    DQUO: '"'
    DQT: '"'
    LEFT_ANGLE_BRACKET: <
    LABK: <
    LT: <
    RIGHT_ANGLE_BRACKET: '>'
    RABK: '>'
    GT: '>'
    QUESTION: '?'
    QUES: '?'
