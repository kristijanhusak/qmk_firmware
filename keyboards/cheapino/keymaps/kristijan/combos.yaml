# Combos for keymap-drawer (it can't read them from keymap.c), keep in sync
# with key_combos[]. Positions: 0-9 top row, 10-19 home row, 20-29 bottom
# row, 30-35 thumbs, left to right.
combos:
  - {p: [10, 11], k: '`', l: [BASE]}
  - {p: [11, 12], k: '-', l: [BASE]}
  - {p: [12, 13], k: Esc, l: [BASE]}
  - {p: [17, 18], k: "'", l: [BASE]}
  - {p: [22, 23], k: Tab, l: [BASE]}
  - {p: [26, 27], k: Tab, l: [BASE]}
  - {p: [15, 16], k: Home, l: [NAV]}
  - {p: [17, 18], k: End, l: [NAV]}
  - {p: [25, 26], k: PgDn, l: [NAV]}
  - {p: [27, 28], k: PgUp, l: [NAV]}
